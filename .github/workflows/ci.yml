name: tests

# Run the test suite on every pull request and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The tests only need pytest, pygame, pyyaml and matplotlib (for the plot test). Camera libraries (OpenCV,
      # MediaPipe) are not needed, which keeps this job fast.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pygame pyyaml numpy opencv-python-headless==4.12.0.88
      - name: Run all tests
        run: python -m pytest -q tests
        env:
          # No screen or sound card on the CI machine; pygame runs headless.
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
